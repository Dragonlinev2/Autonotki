version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: autonotki-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: AUTONOTKI

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
